# ==============================================================================
# Teste de Integração 10: Alteração de Status pelo Organizador do Evento
# ==============================================================================
# Descrição: Abre a tela de detalhes de um evento criado pelo próprio usuário,
#            valida as ações do organizador ("Gerenciar") e alterna status.
# ==============================================================================

appId: br.com.uri.meuprojeto
---
- launchApp:
    clearState: false

# 1. Autenticação via Subfluxo Reutilizável
- runFlow: subflows/login_helper.yaml

# 2. Navegação para os Meus Eventos pelo Ícone de Perfil
- tapOn:
    id: "btnProfile"

# 3. Acessa os Eventos Criados pelo Botão de Gestão
- assertVisible:
    id: "btnManageMyEvents"
- tapOn:
    id: "btnManageMyEvents"

# 4. Se a lista estiver vazia, cria um novo evento
- runFlow:
    when:
      visible:
        id: "tvNoMyEvents"
    commands:
      - tapOn:
          id: "btnBack"
      - tapOn:
          id: "fabAddEvent"
      - tapOn:
          id: "etEventTitle"
      - inputText: "Evento Gestao Teste"
      - tapOn:
          id: "etEventDescription"
      - inputText: "Descricao de evento para teste de gestao pelo criador."
      - tapOn:
          id: "etEventLocation"
      - inputText: "Auditorio Principal"
      - tapOn:
          id: "etMaxParticipants"
      - inputText: "30"
      - hideKeyboard
      - scroll
      - tapOn:
          id: "btnSaveEvent"
      - tapOn:
          id: "btnProfile"
      - tapOn:
          id: "btnManageMyEvents"

# 5. Seleciona o primeiro evento criado na lista de MyEventsActivity
- assertVisible:
    id: "rvMyEvents"

- tapOn:
    id: "tvEventTitle"
    index: 0

# 6. Validação do botão de gestão "Gerenciar" e do painel do criador
- assertVisible:
    id: "btnSubscribe"
- tapOn:
    id: "btnSubscribe"

# 7. Validação da presença do botão de alternar status no painel
- assertVisible:
    id: "btnToggleStatus"
