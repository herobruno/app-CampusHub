# ==============================================================================
# Teste de Integração 04: Pesquisa Dinâmica de Eventos por Texto
# ==============================================================================
# Descrição: Digita no campo de busca etSearchQuery na HomeActivity e verifica
#            a filtragem dinâmica da lista de eventos no RecyclerView.
# ==============================================================================

appId: br.com.uri.meuprojeto
---
- launchApp:
    clearState: false

# 1. Autenticação via Subfluxo Reutilizável
- runFlow: subflows/login_helper.yaml

# 2. Digitação no Campo de Busca
- assertVisible:
    id: "etSearchQuery"
- tapOn:
    id: "etSearchQuery"
- inputText: "a"

- hideKeyboard

# 3. Validação da Busca
- runFlow:
    when:
      visible:
        id: "rvEvents"
    commands:
      - assertVisible:
          id: "rvEvents"

- runFlow:
    when:
      visible:
        id: "tvEmpty"
    commands:
      - assertVisible:
          id: "tvEmpty"

# 4. Limpa a Busca para Garantir Restauração da Lista
- tapOn:
    id: "etSearchQuery"
- eraseText: 10
- hideKeyboard

- assertVisible:
    id: "rvEvents"
