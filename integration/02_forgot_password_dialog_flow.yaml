# ==============================================================================
# Teste de Integração 02: Modal de Recuperação de Senha
# ==============================================================================
# Descrição: Clica em "Esqueceu sua senha?", valida a abertura do AlertDialog,
#            insere o e-mail de teste e envia o link de redefinição.
# ==============================================================================

appId: br.com.uri.meuprojeto
---
- launchApp:
    clearState: true

# 1. Clica no link de recuperação de senha
- assertVisible:
    id: "tvForgotPassword"
- tapOn:
    id: "tvForgotPassword"

# 2. Valida o título do Modal AlertDialog
- assertVisible: "Recuperar Senha"

# 3. Insere o e-mail de teste no campo do Modal
- tapOn: "E-mail"
- inputText: "maestro_test@uri.br"

# 4. Confirma o envio clicando em "Enviar"
- tapOn: "Enviar"

# 5. Confirma retorno à tela de Login
- assertVisible:
    id: "etEmail"
