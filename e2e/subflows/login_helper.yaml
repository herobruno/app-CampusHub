# ==============================================================================
# Subfluxo Reutilizável de Autenticação para o Maestro
# ==============================================================================

appId: br.com.uri.meuprojeto
---
# 1. Se a tela de Login estiver visível, efetua o Login
- runFlow:
    when:
      visible:
        id: "etEmail"
    commands:
      - tapOn:
          id: "etEmail"
      - inputText: "${EMAIL != null ? EMAIL : 'maestro_test@uri.br'}"
      - tapOn:
          id: "etPassword"
      - inputText: "${PASSWORD != null ? PASSWORD : '123456'}"
      - hideKeyboard
      - tapOn:
          id: "btnLogin"

# 2. Se a Home não estiver visível (login falhou pois a conta não existe), faz o registro
- runFlow:
    when:
      notVisible:
        id: "fabAddEvent"
    commands:
      - runFlow:
          when:
            visible:
              id: "tvGoToRegister"
          commands:
            - tapOn:
                id: "tvGoToRegister"
      - runFlow:
          when:
            visible:
              id: "etName"
          commands:
            - tapOn:
                id: "etName"
            - inputText: "Usuário Teste Maestro"
            - tapOn:
                id: "etEmail"
            - inputText: "${EMAIL != null ? EMAIL : 'maestro_test@uri.br'}"
            - tapOn:
                id: "etPassword"
            - inputText: "${PASSWORD != null ? PASSWORD : '123456'}"
            - hideKeyboard
            - tapOn:
                id: "btnRegister"
            - tapOn:
                id: "etEmail"
            - inputText: "${EMAIL != null ? EMAIL : 'maestro_test@uri.br'}"
            - tapOn:
                id: "etPassword"
            - inputText: "${PASSWORD != null ? PASSWORD : '123456'}"
            - hideKeyboard
            - tapOn:
                id: "btnLogin"

# 3. Confirma que o usuário está autenticado na Home
- assertVisible:
    id: "fabAddEvent"
